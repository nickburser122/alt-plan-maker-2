<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5F1F4">
  <meta name="description" content="Mauvine Rota — a bilingual, browser-based scheduling workspace for teams, sites and rules.">
  <title>Mauvine Rota · Plan with clarity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/ui/tokens.css">
  <link rel="stylesheet" href="src/ui/components.css">
  <link rel="stylesheet" href="src/ui/mobile.css">
  <link rel="stylesheet" href="src/ui/forms.css">
  <link rel="stylesheet" href="src/ui/polish.css">
  <style>
    .site-shell{min-height:100vh}
    .site-header{border-bottom:1px solid var(--hairline);background:var(--bg-card)}
    .site-header-inner{max-width:1180px;margin:auto;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .site-brand{display:flex;align-items:center;gap:13px;text-decoration:none;color:var(--ink-900)}
    .site-brand .mark{width:42px;height:42px;flex:none}
    .site-brand strong{font:600 25px/1 Fraunces,"IBM Plex Sans Arabic",serif;display:block}
    .site-brand small{display:block;margin-top:5px;color:var(--ink-500);font:600 10px "JetBrains Mono",monospace;letter-spacing:.13em;text-transform:uppercase}
    .site-note{font-size:12px;color:var(--ink-500);text-align:right}
    .workspace{max-width:1180px;margin:auto;padding:34px 24px 80px}
    .workspace-intro{margin-bottom:25px;display:flex;align-items:end;justify-content:space-between;gap:20px}
    .workspace-intro h1{font:600 clamp(30px,4vw,46px)/1.12 Fraunces,"IBM Plex Sans Arabic",serif;letter-spacing:-.025em;margin:8px 0}
    .workspace-intro p{color:var(--ink-500);margin:0;max-width:610px}
    .workspace .seg{margin-bottom:22px;max-width:100%;overflow-x:auto;flex-wrap:nowrap}
    .workspace .seg button{white-space:nowrap;padding:9px 15px}
    .view-container{min-width:0}
    .site-footer{max-width:1180px;margin:auto;padding:20px 24px 35px;border-top:1px solid var(--hairline);color:var(--ink-500);font-size:12px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
    html[dir="rtl"] .site-note{text-align:left}
    @media(max-width:680px){.site-header-inner{padding:16px}.site-note{display:none}.workspace{padding:25px 16px 55px}.workspace-intro h1{font-size:32px}.workspace .seg{display:flex}.workspace .seg button{flex:none}.site-footer{padding:18px 16px 30px}}
  </style>
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <div class="site-header-inner">
        <a class="site-brand" href="./" aria-label="Mauvine Rota home">
          <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 10h18M8 15l2.5 2.5L16 13"/></svg></span>
          <span><strong>Mauvine Rota</strong><small>Thoughtful scheduling</small></span>
        </a>
        <span class="site-note">Your plans stay in this browser.<br>Export a copy to keep a backup.</span>
      </div>
    </header>
    <main class="workspace" id="main-content">
      <section class="workspace-intro" aria-labelledby="workspace-title">
        <div><span class="kicker">THE WORKSPACE</span><h1 id="workspace-title">A clearer way to plan.</h1><p>Organize people, places and rules. Let the rota come together.</p></div>
      </section>
      <section id="app" aria-label="Rota planner"></section>
    </main>
    <footer class="site-footer"><span>Mauvine Rota · A scheduling workspace</span><span>Saved locally on this device · English / العربية</span></footer>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
